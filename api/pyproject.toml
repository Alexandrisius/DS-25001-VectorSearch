[project]
name = "ksr-vector-search"
version = "2.0.0"
description = "Семантический поиск по КСР (Классификатор Строительных Ресурсов) с Qdrant + OpenRouter"
requires-python = ">=3.12"
authors = [
    { name = "Alexandr", email = "" }
]

dependencies = [
    # ===== Core =====
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",

    # ===== Database =====
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",

    # ===== Vector DB =====
    "qdrant-client>=1.12.0",

    # ===== Cache / Queue =====
    "redis>=5.2.0",
    "celery>=5.4.0",

    # ===== HTTP / ML API =====
    "httpx[http2]>=0.28.0",
    "tenacity>=9.0.0",

    # ===== Security =====
    "passlib[bcrypt]>=1.7.4",
    # Pin bcrypt<4.0 — passlib 1.7.4 несовместим с bcrypt 4.x (нет __about__)
    "bcrypt>=3.2,<4.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=44.0.0",

    # ===== Excel / Data =====
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # ===== Logging / Monitoring =====
    "loguru>=0.7.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # ===== Misc =====
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ===== Ruff =====
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "PIE", "PT", "RET", "SIM", "TID"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E", "F", "B"]
# Тесты: разрешаем SessionLocal (CamelCase как в проде), однострочные if-ы,
# pass в except, parametrize-дубли (иногда одинаковый input+expected — окей).
"tests/*" = ["E", "F", "B", "DTZ", "N806", "SIM103", "SIM105", "I001", "PT014"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== Pytest =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

# ===== Mypy =====
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
