# =============================================================================
# Alembic configuration
# =============================================================================
# Пути заданы относительно api/ — `cd api && alembic ...`
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false
sourceless = false
output_encoding = utf-8

# sqlalchemy.url подставляется из env.py через os.getenv('SYNC_DATABASE_URL')
sqlalchemy.url = driver://user:pass@localhost/dbname

# Post-commit hook для type hints
[post_write_hooks]

# Log
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
